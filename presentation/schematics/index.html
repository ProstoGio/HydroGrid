<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">HydroGrid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#070b12;
    --panel:#0d1626;
    --panel-2:#101b30;
    --line-dim:#1c2a42;
    --solar:#ffc65c;
    --power:#5b8cff;
    --hydrogen:#3fe8c8;
    --water:#7fd8ff;
    --heat:#ff7a4d;
    --ghost:#66748c;
    --ink:#e7edf7;
    --mist:#9fb0c9;
    --faint:#5c6c85;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 12% -10%, rgba(91,140,255,0.10), transparent 60%),
      radial-gradient(ellipse 900px 600px at 90% 10%, rgba(63,232,200,0.08), transparent 55%),
      var(--void);
    color:var(--ink);
    font-family:'Inter','Noto Sans Georgian',sans-serif;
    min-height:100vh;
  }

  /* ---------- language switch ---------- */
  .lang-switch{
    position:absolute;
    top:38px;
    right:28px;
    z-index:60;
    display:flex;
    gap:4px;
    background:var(--panel);
    border:1px solid var(--line-dim);
    border-radius:10px;
    padding:4px;
    box-shadow:0 14px 40px rgba(0,0,0,.45);
  }
  .lang-switch button{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.08em;
    background:transparent;
    border:none;
    color:var(--mist);
    padding:6px 12px;
    border-radius:7px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .lang-switch button:hover{color:var(--ink);}
  .lang-switch button.active{
    background:var(--panel-2);
    color:var(--hydrogen);
  }
  @media (max-width:640px){
    .lang-switch{position:static; margin:0 0 16px; width:max-content;}
  }

  /* ---------- header ---------- */
  header{
    position:relative;
    padding:38px 28px 18px;
    max-width:1180px;
    margin:0 auto;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--hydrogen);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    width:7px;height:7px;border-radius:50%;
    background:var(--hydrogen);
    box-shadow:0 0 8px 2px rgba(63,232,200,.7);
  }
  h1{
    font-family:'Space Grotesk','Noto Sans Georgian',sans-serif;
    font-weight:700;
    font-size:clamp(28px,4vw,42px);
    margin:10px 0 8px;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--faint); font-weight:600;}
  .sub{
    color:var(--mist);
    font-size:15px;
    max-width:640px;
    line-height:1.55;
    margin:0 0 6px;
  }
  .hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--faint);
    margin-top:14px;
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }
  .hint kbd{
    background:var(--panel);
    border:1px solid var(--line-dim);
    padding:2px 7px;
    border-radius:5px;
    color:var(--mist);
    font-size:10.5px;
  }

  /* ---------- diagram wrapper ---------- */
  .stage{
    max-width:1180px;
    margin:10px auto 0;
    padding:0 0 6px;
  }
  .canvas-wrap{
    position:relative;
    overflow-x:auto;
    overflow-y:hidden;
    border-top:1px solid var(--line-dim);
    border-bottom:1px solid var(--line-dim);
    background:
      linear-gradient(180deg, rgba(255,255,255,0.015), transparent 8%),
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(255,255,255,0.014) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,0.014) 39px 40px);
    -webkit-overflow-scrolling:touch;
  }
  .canvas-wrap::-webkit-scrollbar{height:9px;}
  .canvas-wrap::-webkit-scrollbar-track{background:var(--void);}
  .canvas-wrap::-webkit-scrollbar-thumb{background:var(--line-dim); border-radius:6px;}

  svg#diagram{
    display:block;
    width:100%;
    min-width:980px;
    height:auto;
  }

  .lane-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    letter-spacing:.12em;
    fill:var(--faint);
    text-transform:uppercase;
  }
  .lane-rule{
    stroke:var(--line-dim);
    stroke-width:1;
    stroke-dasharray:2 5;
  }

  /* node base */
  .node-shape{
    fill:var(--panel);
    stroke-width:1.6;
    transition:filter .15s ease, stroke-width .15s ease, fill .15s ease;
  }
  .node-group{cursor:pointer;}
  .node-group:hover .node-shape, .node-group.pinned .node-shape{
    stroke-width:2.4;
    fill:var(--panel-2);
  }
  .node-label{
    font-family:'Space Grotesk','Noto Sans Georgian',sans-serif;
    font-weight:600;
    fill:var(--ink);
    text-anchor:middle;
    dominant-baseline:middle;
  }
  .node-tag{
    font-family:'IBM Plex Mono','Noto Sans Georgian',monospace;
    fill:var(--faint);
    text-anchor:middle;
    letter-spacing:.06em;
    text-transform:uppercase;
  }
  .node-group.support .node-label{font-size:13.5px;}
  .node-group.support .node-tag{font-size:8.6px;}
  .node-group.primary .node-label{font-size:16.5px;}
  .node-group.primary .node-tag{font-size:9.2px;}
  .node-group.ghost .node-shape{stroke-dasharray:4 4; fill:rgba(13,22,38,.55);}
  .node-group.ghost .node-label{fill:var(--mist); font-weight:500;}
  .node-group.end .node-label{font-size:15px;}

  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:13px;
  }
  .badge-circle{fill:var(--void); stroke-width:1.6;}

  .start-ray{stroke:var(--solar); stroke-width:2; opacity:.75;}
  .start-core{fill:var(--void); stroke:var(--solar); stroke-width:2.2;}
  .start-label{
    font-family:'IBM Plex Mono','Noto Sans Georgian',monospace;
    font-size:10px;
    letter-spacing:.1em;
    fill:var(--solar);
    text-anchor:middle;
  }

  /* edges */
  .edge-hit{fill:none; stroke:transparent; stroke-width:18; cursor:pointer;}
  .edge-line{fill:none; stroke-linecap:round; transition:stroke-width .15s ease, filter .15s ease;}
  .edge-line.primary{stroke-width:3;}
  .edge-line.secondary{stroke-width:1.8;}
  .edge-line.dashed{stroke-dasharray:1 9;}
  .edge-line.solidflow{stroke-dasharray:1 9;}
  .edge-group:hover .edge-line, .edge-group.pinned .edge-line{stroke-width:4; filter:brightness(1.35);}

  @keyframes flow{
    to{ stroke-dashoffset:-200; }
  }
  .edge-line{ animation:flow 6s linear infinite; }
  .edge-line.slow{ animation-duration:11s; }
  .edge-line.fast{ animation-duration:3.4s; }

  .edge-label-bg{fill:var(--void); opacity:.001;}
  .edge-label{
    font-family:'IBM Plex Mono','Noto Sans Georgian',monospace;
    font-size:9.6px;
    fill:var(--faint);
    text-anchor:middle;
    letter-spacing:.02em;
    pointer-events:none;
  }

  /* tooltip */
  #tooltip{
    position:fixed;
    max-width:280px;
    background:linear-gradient(180deg, #101c30, #0b1523);
    border:1px solid var(--line-dim);
    border-radius:10px;
    padding:12px 14px;
    font-size:12.8px;
    line-height:1.5;
    color:var(--mist);
    pointer-events:none;
    opacity:0;
    transform:translateY(4px);
    transition:opacity .12s ease, transform .12s ease;
    z-index:50;
    box-shadow:0 14px 40px rgba(0,0,0,.55);
  }
  #tooltip.show{opacity:1; transform:translateY(0);}
  #tooltip .tt-tag{
    font-family:'IBM Plex Mono','Noto Sans Georgian',monospace;
    font-size:9.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    margin-bottom:5px;
    display:block;
  }
  #tooltip .tt-title{
    font-family:'Space Grotesk','Noto Sans Georgian',sans-serif;
    font-weight:700;
    font-size:14.5px;
    color:var(--ink);
    margin-bottom:5px;
    display:block;
  }

  /* legend */
  .legend-wrap{
    max-width:1180px;
    margin:26px auto 60px;
    padding:0 28px;
    display:grid;
    grid-template-columns:1.05fr 1fr;
    gap:16px;
  }
  @media (max-width:760px){ .legend-wrap{grid-template-columns:1fr;} }
  .legend-card{
    background:var(--panel);
    border:1px solid var(--line-dim);
    border-radius:12px;
    padding:16px 18px;
  }
  .legend-title{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--faint);
    margin:0 0 12px;
  }
  .legend-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 0;
    font-size:13px;
    color:var(--mist);
  }
  .legend-row b{color:var(--ink); font-weight:500;}
  .swatch-line{width:26px; height:2px; flex:none; border-radius:2px;}
  .swatch-line.dashed{
    background:none;
    border-top-width:2px;
    border-top-style:dashed;
    height:0;
  }
  .swatch-box{
    width:20px; height:14px; border-radius:4px; flex:none;
    border-width:1.6px; border-style:solid;
  }
  .swatch-box.dash{border-style:dashed; background:rgba(255,255,255,.02);}
  .swatch-num{
    width:20px;height:20px;border-radius:6px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    background:rgba(63,232,200,.08); border:1.6px solid var(--hydrogen); color:var(--hydrogen);
  }

  footer{
    text-align:center;
    font-family:'IBM Plex Mono','Noto Sans Georgian',monospace;
    font-size:10.5px;
    color:var(--faint);
    padding:0 0 40px;
    letter-spacing:.04em;
  }

  @media (prefers-reduced-motion: reduce){
    .edge-line{animation:none;}
  }
</style>
</head>
<body>

<header>
  <div class="lang-switch" id="langSwitch">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="ka">KA</button>
    <button type="button" data-lang="ru">RU</button>
  </div>
  <div class="eyebrow" id="eyebrowEl"></div>
  <h1 id="h1El"></h1>
  <p class="sub" id="subEl"></p>
  <div class="hint" id="hintEl"></div>
</header>

<div class="stage">
  <div class="canvas-wrap" id="canvasWrap">
    <svg id="diagram" viewBox="0 0 1820 1100" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<div id="tooltip"></div>

<div class="legend-wrap">
  <div class="legend-card">
    <p class="legend-title" id="legendTitle1"></p>
    <div id="legendFlow"></div>
  </div>
  <div class="legend-card">
    <p class="legend-title" id="legendTitle2"></p>
    <div id="legendBlocks"></div>
  </div>
</div>

<footer id="footerEl"></footer>

<script>
(function(){

  /* ================= geometry (language independent) ================= */

  const nodes = {
    sun: { shape:'circle', cx:90, cy:210, r:38, color:'solar', tier:'start' },
    pv:  { shape:'rect', cx:300, cy:210, w:190, h:78, color:'power', tier:'support' },
    cc:  { shape:'rect', cx:580, cy:210, w:190, h:78, color:'power', tier:'support' },
    bb:  { shape:'rect', cx:860, cy:210, w:190, h:78, color:'power', tier:'support' },
    wr:  { shape:'rect', cx:280, cy:520, w:210, h:96, color:'hydrogen', tier:'primary', badge:1 },
    el:  { shape:'rect', cx:600, cy:520, w:210, h:96, color:'hydrogen', tier:'primary', badge:2 },
    o2:  { shape:'rect', cx:600, cy:686, w:170, h:64, color:'ghost', tier:'ghost' },
    h2d: { shape:'rect', cx:870, cy:520, w:170, h:72, color:'hydrogen', tier:'support' },
    tank:{ shape:'rect', cx:1150, cy:520, w:230, h:104, color:'hydrogen', tier:'primary', badge:3 },
    relief:{ shape:'rect', cx:1040, cy:686, w:170, h:62, color:'ghost', tier:'ghost' },
    sensors:{ shape:'rect', cx:1260, cy:686, w:170, h:62, color:'ghost', tier:'ghost' },
    ab:  { shape:'rect', cx:870, cy:868, w:180, h:76, color:'hydrogen', tier:'support' },
    fc:  { shape:'rect', cx:1150, cy:868, w:220, h:100, color:'hydrogen', tier:'primary', badge:4 },
    hs:  { shape:'rect', cx:1440, cy:868, w:200, h:86, color:'heat', tier:'support' },
    inv: { shape:'rect', cx:1690, cy:580, w:210, h:92, color:'power', tier:'support' },
    cl:  { shape:'rect', cx:1690, cy:868, w:200, h:84, color:'power', tier:'end' },
    ch:  { shape:'rect', cx:1440, cy:1024, w:200, h:76, color:'heat', tier:'end' },
  };

  const edges = [
    { from:'sun', fs:'right', to:'pv', ts:'left', color:'solar', weight:'secondary', bend:60 },
    { from:'pv', fs:'right', to:'cc', ts:'left', color:'power', weight:'secondary', bend:70 },
    { from:'cc', fs:'right', to:'bb', ts:'left', color:'power', weight:'secondary', bend:70 },
    { from:'bb', fs:'bottom', to:'el', ts:'top', color:'power', weight:'secondary', dashed:true, bend:90 },
    { from:'bb', fs:'right', to:'inv', ts:'top', color:'power', weight:'secondary', bend:140 },
    { from:'wr', fs:'right', to:'el', ts:'left', color:'water', weight:'primary', bend:60 },
    { from:'el', fs:'bottom', to:'o2', ts:'top', color:'ghost', weight:'secondary', dashed:true, bend:60 },
    { from:'el', fs:'right', to:'h2d', ts:'left', color:'hydrogen', weight:'primary', bend:60 },
    { from:'h2d', fs:'right', to:'tank', ts:'left', color:'hydrogen', weight:'primary', bend:70 },
    { from:'tank', fs:'bottom', to:'relief', ts:'top', color:'ghost', weight:'secondary', dashed:true, bend:50 },
    { from:'tank', fs:'bottom', to:'sensors', ts:'top', color:'ghost', weight:'secondary', dashed:true, bend:50 },
    { from:'tank', fs:'bottom', to:'fc', ts:'top', color:'hydrogen', weight:'primary', bend:90 },
    { from:'ab', fs:'right', to:'fc', ts:'left', color:'hydrogen', weight:'secondary', bend:60 },
    { from:'fc', fs:'right', to:'inv', ts:'bottom', color:'power', weight:'secondary', bend:150 },
    { from:'fc', fs:'right', to:'hs', ts:'left', color:'heat', weight:'primary', bend:70 },
    { from:'hs', fs:'top', to:'tank', ts:'right', color:'heat', weight:'secondary', dashed:true, bend:130 },
    { from:'hs', fs:'bottom', to:'ch', ts:'top', color:'heat', weight:'secondary', bend:60 },
    { from:'inv', fs:'bottom', to:'cl', ts:'top', color:'power', weight:'secondary', bend:80 },
    { from:'fc', fs:'left', to:'wr', ts:'bottom', color:'water', weight:'primary', dashed:true, badge:5, bend:260, sweep:true },
  ];

  /* ================= translations ================= */

  const content = {

    en: {
      pageTitle:'HydroGrid — System Diagram',
      eyebrow:'HydroGrid · closed-loop energy storage system',
      h1main:'System diagram',
      h1span:'— how the cycle actually works',
      sub:'Summer\u2019s surplus solar energy is converted into hydrogen; in winter, that hydrogen is converted back into electricity and heat. Pure water is the only byproduct, and it returns to where its journey began.',
      hintP1:'Hover or click any block or connector for details',
      hintP2:'bold, numbered blocks + the return arrow form the five-step main cycle',
      hintP3:'everything else is a supporting subsystem',
      footer:'HYDROGRID — SEASONAL GREEN HYDROGEN STORAGE FOR OFF-GRID ALPINE SITES',
      lanes:['Solar energy and conversion','Hydrogen production → storage','Power and heat generation'],
      startLabel:'start',
      endLabel:'end',
      stageWord:'Stage',
      flowWord:'Flow',
      legendFlowTitle:'Flow lines — what moves',
      legendBlockTitle:'Blocks — what they represent',
      legendFlow:{
        sunlight:{title:'Sunlight', desc:'raw solar energy'},
        dc:{title:'Electricity (DC)', desc:'power routing'},
        h2gas:{title:'Hydrogen gas', desc:'produced, stored, released'},
        water:{title:'Water / condensate', desc:'return path that closes the loop'},
        heat:{title:'Waste heat', desc:'fuel-cell cogeneration'},
        signal:{title:'Signal / venting', desc:'sensors, safety, O\u2082 byproduct'},
      },
      legendBlock:{
        stage:{title:'Main-cycle stage', desc:'five critical steps, in order'},
        support:{title:'Supporting subsystem', desc:'keeps a main stage running'},
        safety:{title:'Safety / instrumentation', desc:'monitoring and venting'},
        input:{title:'Energy input', desc:'where the system begins'},
        output:{title:'Facility output', desc:'where the system ends'},
      },
      nodes:{
        sun:{ tag:'Energy input', label:'SUN', title:'Sunlight',
          desc:'Solar radiation reaching the array, adjusted for altitude at the 2,715 m reference site. The only external resource the whole cycle needs.' },
        pv:{ tag:'Solar energy and conversion', label:'PV array', title:'Photovoltaic array',
          desc:'Panel area is sized from 5 years of real hourly PVGIS-SARAH3 solar data for the reference site — no synthetic weather. Assumed panel efficiency ~20%.' },
        cc:{ tag:'Solar energy and conversion', label:'Charge controller', title:'Charge controller',
          desc:'The MPPT charge controller regulates voltage between the array and the buffer battery, and identifies the surplus energy routed to electrolysis.' },
        bb:{ tag:'Solar energy and conversion', label:'Buffer battery', title:'Buffer battery',
          desc:'Smooths only on a second-by-second scale. Absorbs short-term swings between production and consumption — this isn\u2019t seasonal storage; that job belongs entirely to the hydrogen tank.' },
        wr:{ tag:'Main cycle · Stage 1', label:'Water reservoir', title:'Water reservoir',
          desc:'The start and end point of the closed loop. Purifies incoming water and holds the condensate the fuel cell returns every winter.' },
        el:{ tag:'Main cycle · Stage 2', label:'PEM electrolyzer', title:'PEM electrolyzer',
          desc:'Splits water from the reservoir into H\u2082 and O\u2082 using summer\u2019s surplus solar power. Sized for the facility\u2019s peak surplus output; simulated efficiency ~75%.' },
        o2:{ tag:'Byproduct', label:'O\u2082 vent', title:'O\u2082 release',
          desc:'The byproduct oxygen is safely vented to the atmosphere. No storage or further use — by design, this is a dead-end branch.' },
        h2d:{ tag:'Hydrogen production', label:'H\u2082 dryer', title:'H\u2082 dryer',
          desc:'Removes moisture from the hydrogen stream before it reaches storage, protecting the metal-hydride alloy.' },
        tank:{ tag:'Main cycle · Stage 3', label:'Metal-hydride tank', title:'Metal-hydride tank',
          desc:'Binds hydrogen into the alloy\u2019s solid lattice at under 30 bar. A stored kilogram stays a kilogram regardless of outside temperature — unlike a battery, cold doesn\u2019t shrink its capacity. Release rate, not capacity, is cold-sensitive, which the heating jacket compensates for.' },
        relief:{ tag:'Safety', label:'Relief valve', title:'Pressure relief valve',
          desc:'Automatically vents tank pressure if the internal pressure exceeds the design limit.' },
        sensors:{ tag:'Instrumentation', label:'Level & pressure sensors', title:'Level and pressure sensors',
          desc:'Continuous tank telemetry feeds the control layer, so the system always knows exactly how much hydrogen is available.' },
        ab:{ tag:'Power generation', label:'Air blower', title:'Air blower',

        fc:{ tag:'Main cycle · Stage 4', label:'PEM fuel cell', title:'PEM fuel cell',
          desc:'Recombines stored H\u2082 with ambient O\u2082. About 55% of the released energy becomes electricity; the remaining ~45% becomes useful heat instead of being wasted.' },
        hs:{ tag:'Power and heat generation', label:'Heat distributor', title:'Heat recovery distributor',
          desc:'Splits the fuel cell\u2019s waste heat two ways: back to the tank\u2019s heating jacket, and out to space heating — a cogeneration bonus on top of the electricity.' },
        inv:{ tag:'Solar energy and conversion', label:'Inverter / DC bus', title:'Inverter / DC bus',
          desc:'A shared DC bus and inverter for both solar and fuel-cell power, converting it into usable electricity for the facility.' },
        cl:{ tag:'Facility output', label:'Facility loads', title:'Facility loads',
          desc:'The end of the electrical path. Powers the facility\u2019s equipment and lighting.' },
        ch:{ tag:'Facility output', label:'Space heating', title:'Space heating',
          desc:'The end of the thermal path. The fuel cell\u2019s waste heat warms the cabin directly — free heating a battery-only system would never produce.' },
      },
      edges:[
        {label:'sunlight', desc:'Raw solar radiation reaching the array.'},
        {label:'raw DC', desc:'Unregulated DC from the panels, sent for voltage regulation.'},
        {label:'regulated DC', desc:'Regulated DC charges the buffer battery.'},
        {label:'surplus DC', desc:'Solar power beyond what the battery and cabin need is redirected to electrolysis instead of being wasted.'},
        {label:'battery/solar DC', desc:'DC from the battery and solar feeds the shared bus/inverter for immediate use.'},
        {label:'purified water', desc:'Purified water is the electrolyzer\u2019s feedstock.'},
        {label:'O\u2082 release', desc:'Oxygen is a safe, unused byproduct of water splitting.'},
        {label:'H\u2082 (wet)', desc:'Hydrogen leaves the electrolyzer carrying moisture.'},
        {label:'H\u2082 (dry)', desc:'Dried hydrogen enters storage — the final step of the summer charging path.'},
        {label:'', desc:'Continuous pressure monitoring for safety.'},
        {label:'', desc:'Continuous level and pressure telemetry.'},
        {label:'H\u2082 release', desc:'The start of the winter discharge path.'},
        {label:'ambient O\u2082', desc:'Ambient oxygen feeds the recombination reaction.'},
        {label:'DC output', desc:'The electrical output of the fuel-cell reaction.'},
        {label:'waste heat ~45%', desc:'Waste heat — about 45% of the reaction\u2019s energy.'},
        {label:'return to heating jacket', desc:'Waste heat keeps the tank warm, offsetting the cold-slowed hydrogen release.'},
        {label:'heating', desc:'Waste heat also serves as free cabin heating.'},
        {label:'electricity', desc:'The final delivery of electricity to the facility.'},
        {label:'condensate return — closes the loop', desc:'Stage 5 — water produced by the fuel-cell reaction condenses and is routed back to the reservoir. The step that closes the loop, where pure water is the only byproduct.'},
      ],
    },

    ka: {
      pageTitle:'HydroGrid — სისტემის სქემა',
      eyebrow:'HydroGrid · ჩაკეტილი ციკლის ენერგიის შენახვის სისტემა',

  /* ================= SVG build ================= */

  const SVGNS = 'http://www.w3.org/2000/svg';
  const svg = document.getElementById('diagram');

  function el_(tag, attrs){
    const e = document.createElementNS(SVGNS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  const defs = el_('defs', {});
  svg.appendChild(defs);

  const colorVars = {
    solar:'var(--solar)', power:'var(--power)', hydrogen:'var(--hydrogen)',
    water:'var(--water)', heat:'var(--heat)', ghost:'var(--ghost)'
  };

  function makeGlow(id, deviation){
    const f = el_('filter', {id:id, x:'-60%', y:'-60%', width:'220%', height:'220%'});
    const blur = el_('feGaussianBlur', {stdDeviation:deviation, result:'blur'});
    const merge = el_('feMerge', {});
    merge.appendChild(el_('feMergeNode', {in:'blur'}));
    merge.appendChild(el_('feMergeNode', {in:'SourceGraphic'}));
    f.appendChild(blur); f.appendChild(merge);
    defs.appendChild(f);
  }
  makeGlow('glow-soft', 2.4);
  makeGlow('glow-strong', 4.2);

  Object.keys(colorVars).forEach(function(key){
    const m = el_('marker', {
      id:'arrow-'+key, viewBox:'0 0 10 10', refX:'8', refY:'5',
      markerWidth:'7', markerHeight:'7', orient:'auto-start-reverse'
    });
    const p = el_('path', {d:'M0,0 L10,5 L0,10 z', fill:colorVars[key]});
    m.appendChild(p);
    defs.appendChild(m);
  });

  const laneDefs = [ {y:112}, {y:410}, {y:758} ];
  const laneTextEls = [];
  laneDefs.forEach(function(l){
    svg.appendChild(el_('line', {x1:20, y1:l.y, x2:1800, y2:l.y, class:'lane-rule'}));
    const t = el_('text', {x:20, y:l.y-14, class:'lane-label'});
    svg.appendChild(t);
    laneTextEls.push(t);
  });

  function bounds(n){
    if(n.shape==='circle') return {x0:n.cx-n.r, x1:n.cx+n.r, y0:n.cy-n.r, y1:n.cy+n.r};
    return {x0:n.cx-n.w/2, x1:n.cx+n.w/2, y0:n.cy-n.h/2, y1:n.cy+n.h/2};
  }
  function sidePoint(n, side){
    const b = bounds(n);
    switch(side){
      case 'left': return {x:b.x0, y:n.cy, dx:-1, dy:0};
      case 'right': return {x:b.x1, y:n.cy, dx:1, dy:0};
      case 'top': return {x:n.cx, y:b.y0, dx:0, dy:-1};
      case 'bottom': return {x:n.cx, y:b.y1, dx:0, dy:1};
    }
  }

  function pathFor(edge){
    const a = nodes[edge.from], b = nodes[edge.to];
    const p1 = sidePoint(a, edge.fs);
    const p2 = sidePoint(b, edge.ts);
    const bend = edge.bend || 90;
    let c1, c2;
    if(edge.sweep){
      c1 = {x:p1.x + p1.dx*bend, y:p1.y + Math.max(bend*0.9, 120)};
      c2 = {x:p2.x + p2.dx*bend, y:p2.y + Math.max(bend*0.9, 120)};
    } else {
      c1 = {x:p1.x + p1.dx*bend, y:p1.y + p1.dy*bend};
      c2 = {x:p2.x + p2.dx*bend, y:p2.y + p2.dy*bend};
    }
    return {
      d:'M '+p1.x+' '+p1.y+' C '+c1.x+' '+c1.y+', '+c2.x+' '+c2.y+', '+p2.x+' '+p2.y,
      mid: edge.sweep
        ? {x:(p1.x+p2.x)/2, y:Math.max(p1.y,p2.y) + Math.max(bend*0.55, 80)}
        : {x:(p1.x+p2.x)/2*0.5 + (c1.x+c2.x)/2*0.5, y:(c1.y+c2.y)/2}
    };
  }

  const edgeLayer = el_('g', {id:'edges'});
  svg.appendChild(edgeLayer);

  const edgeEls = [];
  edges.forEach(function(edge, i){
    const g = el_('g', {class:'edge-group', 'data-i':i});
    const geo = pathFor(edge);
    const isPrimary = edge.weight === 'primary';

    const hit = el_('path', {d:geo.d, class:'edge-hit'});
    const line = el_('path', {
      d:geo.d,
      class:'edge-line ' + (isPrimary?'primary':'secondary') + (edge.dashed?' dashed':' solidflow') + (edge.sweep?' slow':(isPrimary?' fast':'')),
      stroke: colorVars[edge.color],
      'marker-end':'url(#arrow-'+edge.color+')',
      style:'filter:url(#glow-soft)'
    });

    g.appendChild(line);
    g.appendChild(hit);

    const lbl = el_('text', {x:geo.mid.x, y:geo.mid.y-6, class:'edge-label'});
    g.appendChild(lbl);

    if(edge.badge){
      const bc = el_('circle', {cx:geo.mid.x, cy:geo.mid.y-24, r:11, fill:'var(--void)', stroke:colorVars[edge.color], 'stroke-width':1.6});
      const bt = el_('text', {x:geo.mid.x, y:geo.mid.y-24, class:'badge', fill:colorVars[edge.color], 'text-anchor':'middle', 'dominant-baseline':'middle'});
      bt.textContent = edge.badge;
      g.appendChild(bc); g.appendChild(bt);
    }

    attachHover(g);
    edgeLayer.appendChild(g);
    edgeEls.push({group:g, labelEl:lbl});
  });

  const nodeLayer = el_('g', {id:'nodes'});
  svg.appendChild(nodeLayer);

  const nodeEls = {};
  Object.keys(nodes).forEach(function(id){
    const n = nodes[id];
    const color = colorVars[n.color];
    const g = el_('g', {class:'node-group ' + n.tier, 'data-id':id});
    const refs = {group:g};

    if(n.shape==='circle'){
      for(let a=0; a<8; a++){
        const ang = a * Math.PI/4;
        const r1 = n.r+6, r2 = n.r+16;
        g.appendChild(el_('line', {
          x1:n.cx+Math.cos(ang)*r1, y1:n.cy+Math.sin(ang)*r1,
          x2:n.cx+Math.cos(ang)*r2, y2:n.cy+Math.sin(ang)*r2,
          class:'start-ray'
        }));
      }
      g.appendChild(el_('circle', {cx:n.cx, cy:n.cy, r:n.r, class:'start-core', style:'filter:url(#glow-strong)'}));
      const lbl = el_('text', {x:n.cx, y:n.cy+2, class:'start-label'});
      g.appendChild(lbl);
      refs.lblEl = lbl;
      const tag = el_('text', {x:n.cx, y:n.cy-n.r-22, class:'node-tag'});
      tag.setAttribute('fill', color);
      g.appendChild(tag);
      refs.startTagEl = tag;
    } else {
      const b = bounds(n);
      const rect = el_('rect', {
        x:b.x0, y:b.y0, width:n.w, height:n.h, rx:14,
        class:'node-shape', stroke:color
      });
      if(n.tier==='primary') rect.setAttribute('style','filter:url(#glow-strong)');
      else if(n.tier==='end') rect.setAttribute('style','filter:url(#glow-soft)');
      g.appendChild(rect);

      const tag = el_('text', {x:n.cx, y:b.y0+18, class:'node-tag'});
      tag.setAttribute('fill', n.tier==='ghost' ? 'var(--faint)' : color);
      g.appendChild(tag);
      refs.tagEl = tag;

      const lbl = el_('text', {x:n.cx, y:n.cy+8, class:'node-label'});
      g.appendChild(lbl);
      refs.lblEl = lbl;

      if(n.tier==='end'){
        const et = el_('text', {x:n.cx, y:b.y1-10, class:'node-tag'});
        et.setAttribute('fill', color);
        g.appendChild(et);
        refs.endTagEl = et;
      }

      if(n.badge){
        const bx = b.x0+2, by = b.y0+2;
        g.appendChild(el_('circle', {cx:bx, cy:by, r:13, class:'badge-circle', stroke:color}));
        const bt = el_('text', {x:bx, y:by+1, class:'badge', fill:color, 'text-anchor':'middle', 'dominant-baseline':'middle'});
        bt.textContent = n.badge;
        g.appendChild(bt);
      }
    }

    attachHover(g);
    nodeLayer.appendChild(g);
    nodeEls[id] = refs;
  });

  /* ================= tooltip ================= */

  const tooltip = document.getElementById('tooltip');
  let pinned = null;

  function updateTipContent(g){
    const color = colorVarFor(g);
    tooltip.innerHTML =
      '<span class="tt-tag" style="color:'+color+'">'+g.dataset.tag+'</span>'+
      '<span class="tt-title">'+g.dataset.title+'</span>'+
      g.dataset.desc;
  }
  function showTip(g, evt){
    updateTipContent(g);
    tooltip.classList.add('show');
    positionTip(evt);
  }
  function colorVarFor(g){
    const idAttr = g.getAttribute('data-id');
    if(idAttr && nodes[idAttr]) return colorVars[nodes[idAttr].color];
    const i = g.getAttribute('data-i');
    if(i !== null) return colorVars[edges[i].color];
    return 'var(--mist)';
  }
  function positionTip(evt){
    const pad = 16;
    let x = evt.clientX + pad;
    let y = evt.clientY + pad;
    const tw = 300, th = 140;
    if(x + tw > window.innerWidth) x = evt.clientX - tw - pad;
    if(y + th > window.innerHeight) y = evt.clientY - th - pad;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  }
  function hideTip(){
    if(pinned) return;
    tooltip.classList.remove('show');
  }

  function attachHover(g){
    g.addEventListener('mouseenter', function(e){ if(!pinned) showTip(g, e); });
    g.addEventListener('mousemove', function(e){ if(!pinned) positionTip(e); });
    g.addEventListener('mouseleave', hideTip);
    g.addEventListener('click', function(e){
      e.stopPropagation();
      if(pinned === g){
        pinned.classList.remove('pinned');
        pinned = null;
        hideTip();
      } else {
        if(pinned) pinned.classList.remove('pinned');
        pinned = g;
        g.classList.add('pinned');
        showTip(g, e);
      }
    });
  }
  document.addEventListener('click', function(){
    if(pinned){ pinned.classList.remove('pinned'); pinned = null; }
    tooltip.classList.remove('show');
  });

  /* ================= language application ================= */

  const eyebrowEl = document.getElementById('eyebrowEl');
  const h1El = document.getElementById('h1El');
  const subEl = document.getElementById('subEl');
  const hintEl = document.getElementById('hintEl');
  const footerEl = document.getElementById('footerEl');
  const legendTitle1El = document.getElementById('legendTitle1');
  const legendTitle2El = document.getElementById('legendTitle2');
  const legendFlowEl = document.getElementById('legendFlow');
  const legendBlocksEl = document.getElementById('legendBlocks');

  function renderLegendRows(container, rowDefs, textMap){
    container.innerHTML = '';
    rowDefs.forEach(function(r){
      const div = document.createElement('div');
      div.className = 'legend-row';
      const t = textMap[r.key];
      div.innerHTML = r.swatch + '<b>' + t.title + '</b>&nbsp;\u2014 ' + t.desc;
      container.appendChild(div);
    });
  }

  function nodeDataset(id, lang){
    const c = content[lang].nodes[id];
    return {tag:c.tag, title:c.title, desc:c.desc};
  }
  function edgeDataset(edge, i, lang){
    const c = content[lang];
    const ec = c.edges[i];
    const title = (edge.badge ? c.stageWord+' '+edge.badge+' \u2014 ' : '') +
      c.nodes[edge.from].label + ' \u2192 ' + c.nodes[edge.to].label;
    return {tag:c.flowWord, title:title, desc:ec.desc};
  }

  let currentLang = 'en';

  function applyLanguage(lang){
    if(!content[lang]) return;
    currentLang = lang;
    const c = content[lang];

    document.documentElement.lang = lang;
    document.getElementById('pageTitle').textContent = c.pageTitle;

    eyebrowEl.textContent = c.eyebrow;
    h1El.innerHTML = c.h1main + ' <span>' + c.h1span + '</span>';
    subEl.textContent = c.sub;
    hintEl.innerHTML = c.hintP1 + ' &nbsp;\u00b7&nbsp; <kbd>1\u20134</kbd> ' + c.hintP2 + ' &nbsp;\u00b7&nbsp; ' + c.hintP3;
    footerEl.textContent = c.footer;

    laneTextEls.forEach(function(t, i){ t.textContent = c.lanes[i]; });

    legendTitle1El.textContent = c.legendFlowTitle;
    legendTitle2El.textContent = c.legendBlockTitle;
    renderLegendRows(legendFlowEl, legendFlowRows, c.legendFlow);
    renderLegendRows(legendBlocksEl, legendBlockRows, c.legendBlock);

    Object.keys(nodeEls).forEach(function(id){
      const refs = nodeEls[id];
      const nc = c.nodes[id];
      refs.lblEl.textContent = nc.label;
      if(refs.tagEl) refs.tagEl.textContent = nc.tag;
      if(refs.endTagEl) refs.endTagEl.textContent = c.endLabel;
      if(refs.startTagEl) refs.startTagEl.textContent = c.startLabel;
      const ds = nodeDataset(id, lang);
      refs.group.dataset.tag = ds.tag;
      refs.group.dataset.title = ds.title;
      refs.group.dataset.desc = ds.desc;
    });

    edgeEls.forEach(function(refs, i){
      const ec = c.edges[i];
      refs.labelEl.textContent = ec.label || '';
      const ds = edgeDataset(edges[i], i, lang);
      refs.group.dataset.tag = ds.tag;
      refs.group.dataset.title = ds.title;
      refs.group.dataset.desc = ds.desc;
    });

    document.querySelectorAll('.lang-switch button').forEach(function(b){
      b.classList.toggle('active', b.dataset.lang === lang);
    });

    if(pinned) updateTipContent(pinned);
  }

  document.getElementById('langSwitch').addEventListener('click', function(e){
    const btn = e.target.closest('button[data-lang]');
    if(!btn) return;
    e.stopPropagation();
    applyLanguage(btn.dataset.lang);
  });

  applyLanguage(currentLang);

})();
</script>
</body>
</html>
